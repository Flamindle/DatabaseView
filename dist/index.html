<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySQL 数据库查看器</title>
  <script type="module" crossorigin src="/assets/main-GZwz4JwW.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/ThemeToggle-Dsn7mdR_.js">
  <link rel="modulepreload" crossorigin href="/assets/ConnectionForm-evP68P2t.js">
  <link rel="stylesheet" crossorigin href="/assets/ThemeToggle-CI3pOEBg.css">
  <link rel="stylesheet" crossorigin href="/assets/main-DYUHrWkb.css">
</head>
<body>
  <div class="container">
    <h1 style="display:flex;align-items:center;gap:12px;">
      MySQL 数据库查看器
      <button id="sqliteBtn" style="height:32px;padding:0 16px;border-radius:20px;border:none;background:#c0a062;color:#fff;font-size:12px;font-weight:600;cursor:pointer;" title="打开 SQLite 数据库查看器">SQLite</button>
      <button id="themeToggle" style="height:32px;padding:0 16px;border-radius:20px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(102,126,234,0.4);" title="切换主题">浅色</button>
      <button id="authBtn" style="height:32px;padding:0 16px;border-radius:20px;border:none;background:var(--primary);color:#fff;font-size:12px;font-weight:600;cursor:pointer;" title="管理员登录">登录</button>
      <div id="viewModeContainer" style="margin-left:auto;"></div>
    </h1>

    <!-- 连接表单卡片 -->
    <div class="card" id="connectionCard">
      <div id="connectionContainer"></div>
    </div>

    <!-- 消息提示 -->
    <div id="message" class="message" style="display:none;"></div>

    <!-- 工具栏 + 字段配置卡片 -->
    <div class="card" id="dataCard">
      <!-- 表格工具栏 -->
      <div id="toolbarContainer"></div>

      <!-- 字段配置面板 -->
      <div id="columnManagerContainer"></div>

      <!-- 数据展示区域 -->
      <div id="dataContainer"></div>

      <!-- 分页控件 -->
      <div id="paginationContainer"></div>
    </div>
  </div>

</body>
</html>
